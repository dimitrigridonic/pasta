# Pasta-Trockner — Konfiguration (zigbee2mqtt / MQTT).
# Geräte werden über ihre z2m friendly_names angesprochen.

mqtt:
  host: localhost
  port: 1883

web:
  host: 0.0.0.0      # vom Handy im WLAN erreichbar
  port: 8000

control:
  poll_interval: 15          # Sekunden zwischen Regel-Ticks (liest MQTT-Cache)
  aggregate: average         # average | max | min — wie aus den Sensoren EIN Regelwert wird
  temp_low: 30               # Heizungen AN unterhalb (°C) – Standard; je Phase überschreibbar (temp_low/temp_high)
  temp_high: 32              # Heizungen AUS oberhalb (°C)
  max_temp: 42               # harte Sicherheits-Abschaltung der Heizungen (°C) – muss ÜBER dem
                             # höchsten temp_high aller Programme liegen (Caserecce: 38)
  humidity_hysteresis: 3     # Reserve über der Ideallinie (% rF)
  fan_cycle_min: 5           # Heizung & Lüfter wechseln links/rechts alle X Min (< heater_max_on!)
  rate_window_min: 40        # Messfenster für die Feuchte-Abfallrate (Trigger + Anzeige)
  heater_min_on: 5           # Heizung Mindest-Laufzeit (Min, Trägheit)
  heater_min_off: 5          # Heizung Mindest-Pause (Min)
  # Abluft = FEUCHTEGESTEUERT: beide Lüfter blasen die feuchte Luft raus, sobald die
  # Feuchte zu hoch steht oder zu langsam fällt; nahe an der Ideallinie wieder aus.
  fan_high_margin: 4.0       # Feuchte > Ideallinie + dieser Marge (%rF) -> sofort Abluft AN
  fan_min_drop: 0.5          # Abfallrate (%rF/h) darunter = "zu langsam" -> Abluft AN
  fan_off_margin: 1.0        # Feuchte <= Ideallinie + dieser Marge (%rF) -> Abluft AUS (nicht übertrocknen)
  fan_stall_h: 5             # (ungenutzt seit feuchtegesteuerter Abluft)
  fan_stall_drop: 1.0        # (ungenutzt seit feuchtegesteuerter Abluft)
  heater_max_on: 10          # SICHERHEIT: Heizung-Dauerlauf > X Min -> verriegelnder Not-Aus
  override_max_min: 8        # manueller Eingriff (Heizung/Lüfter erzwingen) läuft max. so lange -> dann auto-aus (< heater_max_on!)
  preheat_enabled: true      # Vorheizen (leerer Kasten) vor dem Programm
  preheat_min: 30            # ZEITBASIERT: beide Heizungen volle Leistung so lange (Min),
                             # dann Programmstart. Kein Sensor im Kasten -> rein über Zeit.
                             # Startwert; mit beiden Heizungen heizt es schneller -> kalibrieren.
  side_bias_min: 2.5         # ab dieser Feuchte-Differenz L/R (%rF) wird die feuchtere Seite geheizt
                             # (statt stur abzuwechseln); darunter normaler Seitenwechsel im Takt

# Relais-Kanäle: l1 = Heizung, l2 = Lüfter (per Leistungsmessung verifiziert)
heaters:
  - { name: "Heizung links",  device: "Relais links",  prop: state_l1 }
  - { name: "Heizung rechts", device: "Relais rechts", prop: state_l1 }
fans:
  - { name: "Lüfter links",   device: "Relais links",  prop: state_l2 }
  - { name: "Lüfter rechts",  device: "Relais rechts", prop: state_l2 }

# Sensoren = z2m friendly_names (Push: Werte kommen von selbst, keine Batterie-Kosten)
sensors:
  - "Sensor 1"
  - "Sensor 2"
  - "Sensor 3"
  - "Sensor 4"
  - "Sensor 5"
  - "Sensor 6"

# Links/Rechts-Zuordnung für die intelligente Heizseiten-Wahl.
# Die feuchtere Seite wird geheizt; eine schon trockenere Seite NICHT.
# Mitte (Sensor 1 & 4) bleibt neutral -> zählt nur zum Gesamtwert (Ideallinie/Ruhephase).
sides:
  left:  ["Sensor 2", "Sensor 6"]
  right: ["Sensor 3", "Sensor 5"]

# Feuchte-Referenz: an diesen Leit-Sensoren orientiert sich die Ideallinie/Ruhephase.
# Leer = der aggregate_sensors-Pool (bzw. alle). Die Mitte (S1/S4) sitzt in der schlecht
# belüfteten Totzone -> nur die 4 äusseren nehmen (unten + oben, links + rechts).
# Im UI live umschaltbar (Alle ⌀ <-> Guide).
humidity_guide: ["Sensor 6", "Sensor 3", "Sensor 2", "Sensor 5"]

# Sensoren für die Durchschnitte agg_temp/agg_hum (Regelwert + "alle"-Feuchte).
# Leer = alle. Hier: Mitte (S1/S4) ausgeschlossen, nur die 4 äusseren.
# WICHTIG: der Übertemperatur-Not-Aus (max_temp) misst weiter über ALLE Sensoren.
aggregate_sensors: ["Sensor 6", "Sensor 3", "Sensor 2", "Sensor 5"]

# Feuchte-Bezug im Home-Tab live umschaltbar: Alle (aggregate_sensors) /
# Obere (humidity_upper) / Untere (humidity_lower).
humidity_upper: ["Sensor 2", "Sensor 5"]   # obere äussere
humidity_lower: ["Sensor 6", "Sensor 3"]   # untere äussere

logging:
  enabled: true
  file: history.db
  interval: 60

# Trocken-Programme (Seed; im Browser editierbar -> programs.json)
programs:
  - name: "Maccheroni (16-20-20-12)"
    phases:
      - { name: "80% halten", duration_h: 16, humidity_start: 80, humidity_end: 80 }
      - { name: "80→70%",     duration_h: 20, humidity_start: 80, humidity_end: 70 }
      - { name: "70→60%",     duration_h: 20, humidity_start: 70, humidity_end: 60 }
      - { name: "60→50%",     duration_h: 12, humidity_start: 60, humidity_end: 50 }

  # Caserecce wärmer: Band 36–38 °C (überschreibt temp_low/temp_high je Phase)
  - name: "Caserecce (10-10-5)"
    phases:
      - { name: "80% halten", duration_h: 10, humidity_start: 80, humidity_end: 80, temp_low: 36, temp_high: 38 }
      - { name: "80→70%",     duration_h: 10, humidity_start: 80, humidity_end: 70, temp_low: 36, temp_high: 38 }
      - { name: "70→60%",     duration_h: 5,  humidity_start: 70, humidity_end: 60, temp_low: 36, temp_high: 38 }

  - name: "Test (schnell, 6 min)"
    phases:
      - { name: "Test 80%", duration_h: 0.0333, humidity_start: 80, humidity_end: 80 }
      - { name: "Test 70%", duration_h: 0.0333, humidity_start: 80, humidity_end: 70 }
      - { name: "Test 60%", duration_h: 0.0333, humidity_start: 70, humidity_end: 60 }
